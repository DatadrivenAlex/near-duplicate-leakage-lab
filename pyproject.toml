[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "near-duplicate-leakage-lab"
version = "0.1.0"
description = "Auditing cross-split text leakage with exact Jaccard or MinHash LSH"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Alexandru Cojocari"}]

[project.scripts]
leakage-audit = "leakage_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
